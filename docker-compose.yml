version: '3.8'

services:
  # Local zone MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: ignis-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: always

  # Central Cloud MQTT Broker
  cloud-broker:
    image: eclipse-mosquitto:2
    container_name: ignis-cloud-broker
    ports:
      - "1884:1883"
    volumes:
      - ./config/mosquitto_cloud.conf:/mosquitto/config/mosquitto.conf:ro
    restart: always

  # InfluxDB Time-Series Database
  influxdb:
    image: influxdb:2.7
    container_name: ignis-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=ignis-org
      - DOCKER_INFLUXDB_INIT_BUCKET=ignis-telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=ignis-super-secret-token
    restart: always

  # Edge Simulator Nodes
  edge-sim-e11:
    build: .
    container_name: ignis-edge-sim-e11
    command: python src/edge_sim.py
    depends_on:
      - mqtt-broker
    env_file:
      - .env
    environment:
      - NODE_ID=E11
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - GPS_LAT=21.940
      - GPS_LON=86.320
      - TICK_INTERVAL=3.0
      - SEASONAL_BASELINE=0.5
    restart: unless-stopped

  edge-sim-e12:
    build: .
    container_name: ignis-edge-sim-e12
    command: python src/edge_sim.py
    depends_on:
      - mqtt-broker
    env_file:
      - .env
    environment:
      - NODE_ID=E12
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - GPS_LAT=21.950
      - GPS_LON=86.330
      - TICK_INTERVAL=3.0
      - SEASONAL_BASELINE=0.5
    restart: unless-stopped

  edge-sim-e13:
    build: .
    container_name: ignis-edge-sim-e13
    command: python src/edge_sim.py
    depends_on:
      - mqtt-broker
    env_file:
      - .env
    environment:
      - NODE_ID=E13
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - GPS_LAT=21.930
      - GPS_LON=86.310
      - TICK_INTERVAL=3.0
      - SEASONAL_BASELINE=0.5
    restart: unless-stopped

  # Local Fog Decision Node
  fog-node:
    build: .
    container_name: ignis-fog-node
    command: python src/fog_node_runner.py
    depends_on:
      - mqtt-broker
      - cloud-broker
    env_file:
      - .env
    environment:
      - CONFIG_PATH=config/zone_config.json
    restart: unless-stopped

  # Local Range Control Center Dashboard
  control-center:
    build: .
    container_name: ignis-control-center
    command: uvicorn src.control_center.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - mqtt-broker
    env_file:
      - .env
    restart: unless-stopped

  # Central Cloud Telemetry Ingestor
  cloud-ingestor:
    build: .
    container_name: ignis-cloud-ingestor
    command: python src/cloud_ingestor/main.py
    depends_on:
      - cloud-broker
      - influxdb
    env_file:
      - .env
    restart: unless-stopped

  # Central NOC Cloud Dashboard
  cloud-dashboard:
    build: .
    container_name: ignis-cloud-dashboard
    command: uvicorn src.cloud_dashboard.app:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    depends_on:
      - cloud-broker
      - influxdb
    env_file:
      - .env
    volumes:
      - ./historical:/app/historical
    restart: unless-stopped
